apply plugin: 'groovy'
apply plugin: 'maven-publish'

group = 'com.sameer.arora.obfuscator'
version = '1.0.0'

dependencies {
    compileOnly "com.android.tools.build:gradle-api:9.4.0"
    implementation "commons-io:commons-io:2.5"
    //gradle sdk
    implementation gradleApi()
    //groovy sdk
    implementation localGroovy()
    implementation "com.github.CodingGay.BlackObfuscator:dex-tools:2.2"
}

repositories {
    mavenCentral()
    maven {
        url uri('../localRepo')
    }
}

publishing {
    publications {
        plugin(MavenPublication) {
            from components.java
            groupId = group
            artifactId = 'plugin'
            version = version
        }
    }
    repositories {
        maven {
            url uri('../localRepo')
        }
    }
}

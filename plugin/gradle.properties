# Central Portal publishing flags (non-secret, safe to commit).
# Credentials (mavenCentralUsername/mavenCentralPassword) and signing key material
# (signingInMemoryKey/signingInMemoryKeyId/signingInMemoryKeyPassword) must NOT go
# here — put them in your global ~/.gradle/gradle.properties instead.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
